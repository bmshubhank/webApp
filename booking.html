
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPL Ticket Booking</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/app.js" defer></script>
    
</head>
<body>
    <div id="toast"></div>
    <header>
        <h1>IPL Ticket Booking</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="index.html">Matches</a>
        </nav>
    </header>

<main>
    <section id="booking">
        <h2>Book Your Tickets</h2>

        <form id="bookingForm">

            <label for="name">Full Name:</label>
            <input type="text" id="name" required minlength="3" maxlength="30">

            <label for="email">Email:</label>
            <input type="email" id="email" required>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" pattern="[0-9]{10}" required
                   placeholder="Enter 10-digit number">

            <label for="match">Select Match:</label>
            <select id="match" required>
                <option value="">Choose Match</option>
                <option value="RCB vs CSK">RCB vs CSK</option>
                <option value="MI vs KKR">MI vs KKR</option>
                <option value="CSK vs SRH">CSK vs SRH</option>
            </select>

            <label for="stand">Stand Category:</label>
            <select id="stand" required>
                <option value="">Choose Stand</option>
                <option value="General" data-price="800">General - ₹800</option>
                <option value="Premium" data-price="2000">Premium - ₹2000</option>
                <option value="VIP" data-price="5000">VIP - ₹5000</option>
            </select>

            <label for="quantity">Number of Tickets:</label>
            <input type="number" id="quantity" min="1" max="10" required>

            <p>Select Seating Preference:</p>
            <input type="radio" id="regular" name="preference"
                   value="Regular Seating" required>
            <label for="regular">Regular Seating</label>

            <input type="radio" id="family" name="preference"
                   value="Family Seating">
            <label for="family">Family Seating</label>

            <p>
                <input type="checkbox" id="terms" required>
                <label for="terms">I agree to the booking terms.</label>
            </p>

            <button type="submit">Book Now</button>
            <button type="reset">Reset</button>

        </form>

        


    </section>
</main>

<footer>
    <p>IPL Ticket Booking Website</p>
</footer>

</body>
</html>
